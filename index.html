<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grimbit</title>
<style>
:root{--bg:#f6f4f1;--fg:#1d1a1c;--dim:#6b6468;--accent:#9b2335;--rule:#e2ddd8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141114;--fg:#ece7e9;--dim:#a39ba0;--accent:#e0566b;--rule:#2c262a;color-scheme:dark}}
body{background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-inline:16px;padding-block:40px 64px}
main{max-width:68ch;margin:0 auto}
h1{font-size:2rem;line-height:1.2;margin:0 0 4px}
.meta{color:var(--dim);font-size:.9rem;margin:0 0 32px}
p{margin:0 0 12px}

</head>

<main>
<h1>Grimbit</h1>

<p>Fight through stages, collect gear with traits, rebirth for Souls and push the endless Abyss.</p>

</html>
